<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>잠입 감시 기록</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+KR:wght@500;800;900&display=swap');

  :root{
    --bg:#020402;
    --bezel:#15181a;
    --bezel-hi:#2a2f33;
    --phosphor:#39ff6e;
    --phosphor-dim:#0f6b2c;
    --alert:#ff3b3b;
    --amber:#ffcc33;
    --glass:#04120a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:radial-gradient(ellipse at 50% 0%, #14181a 0%, #030403 65%);
    font-family:'Noto Sans KR',sans-serif;
    color:var(--phosphor);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .rig{ display:flex;flex-direction:column;align-items:center; gap:12px; padding:20px; }
  .topline{ width:838px; display:flex; justify-content:space-between; align-items:flex-end; }
  .topline h1{
    font-family:'VT323',monospace; font-size:26px; letter-spacing:3px; margin:0;
    color:var(--phosphor); text-shadow:0 0 10px rgba(57,255,110,.55);
    transition:color .4s, text-shadow .4s;
  }
  .topline .tag{ font-family:'VT323',monospace; font-size:16px; color:var(--phosphor-dim); letter-spacing:2px; }

  .stagebar{ width:838px; display:flex; gap:8px; }
  .stagebar .seg{
    flex:1; height:6px; border-radius:3px; background:#1a2420;
    border:1px solid #24352b; overflow:hidden; position:relative;
  }
  .stagebar .seg .fill{ position:absolute; inset:0; width:0%; background:var(--phosphor); box-shadow:0 0 8px var(--phosphor); transition:width .3s; }
  .stagebar .seg.done .fill{ width:100%; }
  .stagebar .seg.active .fill{ width:var(--p,0%); }

  .monitor{
    position:relative; width:838px; padding:22px 22px 30px;
    background:linear-gradient(155deg, var(--bezel-hi), var(--bezel) 40%, #0c0e0f 100%);
    border-radius:22px;
    box-shadow:0 30px 70px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06), inset 0 -2px 6px rgba(0,0,0,.6);
  }
  .screws{position:absolute; width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #555, #111 70%); box-shadow:inset 0 0 2px #000;}
  .screws.tl{top:12px;left:12px;} .screws.tr{top:12px;right:12px;}
  .screws.bl{bottom:14px;left:12px;} .screws.br{bottom:14px;right:12px;}

  .screen-wrap{
    position:relative; border-radius:10px; overflow:hidden;
    box-shadow:inset 0 0 40px rgba(0,0,0,.9), inset 0 0 0 2px #000;
    background:var(--glass);
  }
  canvas{ display:block; background:var(--glass); }

  .fx{position:absolute; inset:0; pointer-events:none;}
  .fx.scan{
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply; animation:scanmove 6s linear infinite;
  }
  .fx.vignette{ background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  .fx.flicker{ background:rgba(57,255,110,.03); animation:flick 4.2s infinite; }
  @keyframes scanmove{ from{background-position:0 0;} to{background-position:0 40px;} }
  @keyframes flick{ 0%,96%,100%{opacity:0;} 97%{opacity:1;} 98%{opacity:0;} 99%{opacity:.6;} }

  .osd{ position:absolute; inset:0; pointer-events:none; font-family:'VT323',monospace; color:var(--phosphor); text-shadow:0 0 6px rgba(57,255,110,.7); }
  .osd .cam-id{ position:absolute; top:10px; left:14px; font-size:19px; letter-spacing:1px;}
  .osd .lives{ position:absolute; top:34px; left:14px; font-size:18px; letter-spacing:2px; color:var(--alert); text-shadow:0 0 6px rgba(255,59,59,.7);}
  .osd .time{ position:absolute; top:10px; right:14px; font-size:19px; letter-spacing:1px;}
  .osd .rec{ position:absolute; bottom:10px; left:14px; font-size:18px; display:flex; align-items:center; gap:6px;}
  .osd .rec .dot{width:9px;height:9px;border-radius:50%; background:var(--alert); box-shadow:0 0 8px var(--alert); animation:blink 1s steps(1) infinite;}
  @keyframes blink{ 50%{opacity:.15;} }
  .osd .evid{ position:absolute; bottom:10px; right:14px; font-size:18px; letter-spacing:1px;}

  .footer{ width:838px; display:flex; justify-content:space-between; font-family:'VT323',monospace; font-size:16px; color:var(--phosphor-dim); letter-spacing:1px; }
  .footer a.home{ color:var(--phosphor-dim); text-decoration:none; border-bottom:1px dotted var(--phosphor-dim); }
  .footer a.home:hover{ color:var(--phosphor); border-bottom-color:var(--phosphor); }
  kbd{ background:#0c1a10; border:1px solid #1f4d2a; border-radius:3px; padding:0 6px; color:var(--phosphor); font-family:'VT323',monospace; }
</style>
</head>
<body>
<div class="rig">
  <div class="topline">
    <h1 id="mainTitle">▌잠입 감시 기록▐</h1>
    <div class="tag" id="tagLine">SECURITY MONITORING SYSTEM // STAGE 1 of 3</div>
  </div>

  <div class="stagebar">
    <div class="seg" id="seg1"><div class="fill"></div></div>
    <div class="seg" id="seg2"><div class="fill"></div></div>
    <div class="seg" id="seg3"><div class="fill"></div></div>
  </div>

  <div class="monitor">
    <div class="screws tl"></div><div class="screws tr"></div>
    <div class="screws bl"></div><div class="screws br"></div>
    <div class="screen-wrap">
      <canvas id="game" width="800" height="460"></canvas>
      <div class="fx scan"></div>
      <div class="fx vignette"></div>
      <div class="fx flicker"></div>
      <div class="osd">
        <div class="cam-id" id="camId">CAM-01 · 국립 박물관</div>
        <div class="lives" id="livesText">LIVES ♥♥♥♥♥</div>
        <div class="time" id="clock">00:00:00</div>
        <div class="rec"><span class="dot"></span> REC</div>
        <div class="evid" id="evidText">EVIDENCE 0/5</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div><a class="home" href="../index.html">← 목록으로</a> · <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</div>
    <div>경비원에게 발각되면 목숨 -1, 발각 지점부터 재개 · 목숨 0 = 처음부터 재시작</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const camIdEl = document.getElementById('camId');
const clockEl = document.getElementById('clock');
const evidEl = document.getElementById('evidText');
const livesEl = document.getElementById('livesText');
const tagLineEl = document.getElementById('tagLine');
const segEls = [document.getElementById('seg1'), document.getElementById('seg2'), document.getElementById('seg3')];

let simSeconds = 41*3600 + 12*60 + 3;
setInterval(()=>{
  simSeconds++;
  const h = String(Math.floor(simSeconds/3600)%24).padStart(2,'0');
  const m = String(Math.floor(simSeconds/60)%60).padStart(2,'0');
  const s = String(simSeconds%60).padStart(2,'0');
  clockEl.textContent = `${h}:${m}:${s}`;
}, 1000);

// ---------- input ----------
const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  if(status !== 'play') tryAdvanceScreen();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
function tryAdvanceScreen(){ if(status==='start'||status==='caught'||status==='win'){ startGame(); } }

// ---------- helpers ----------
function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function collidesWalls(rect, walls){ for(const w of walls){ if(rectsOverlap(rect,w)) return true; } return false; }

function outerWithDoor(side, pos, size){
  const t = 18;
  let walls = [], door;
  if(side === 'right'){
    walls.push({x:0,y:0,w:W,h:t});
    walls.push({x:0,y:H-t,w:W,h:t});
    walls.push({x:0,y:0,w:t,h:H});
    walls.push({x:W-t,y:0,w:t,h:pos});
    walls.push({x:W-t,y:pos+size,w:t,h:H-(pos+size)});
    door = {x:W-t,y:pos,w:t,h:size};
  } else if(side === 'left'){
    walls.push({x:0,y:0,w:W,h:t});
    walls.push({x:0,y:H-t,w:W,h:t});
    walls.push({x:W-t,y:0,w:t,h:H});
    walls.push({x:0,y:0,w:t,h:pos});
    walls.push({x:0,y:pos+size,w:t,h:H-(pos+size)});
    door = {x:0,y:pos,w:t,h:size};
  } else if(side === 'top'){
    walls.push({x:0,y:H-t,w:W,h:t});
    walls.push({x:0,y:0,w:t,h:H});
    walls.push({x:W-t,y:0,w:t,h:H});
    walls.push({x:0,y:0,w:pos,h:t});
    walls.push({x:pos+size,y:0,w:W-(pos+size),h:t});
    door = {x:pos,y:0,w:size,h:t};
  } else {
    walls.push({x:0,y:0,w:W,h:t});
    walls.push({x:0,y:0,w:t,h:H});
    walls.push({x:W-t,y:0,w:t,h:H});
    walls.push({x:0,y:H-t,w:pos,h:t});
    walls.push({x:pos+size,y:H-t,w:W-(pos+size),h:t});
    door = {x:pos,y:H-t,w:size,h:t};
  }
  return {walls, door};
}

// ---------- 3 distinct stages ----------
function buildMuseum(){
  const o = outerWithDoor('right', 180, 60);
  const walls = [...o.walls,
    {x:250,y:18,w:18,h:170}, {x:250,y:250,w:18,h:192},
    {x:520,y:18,w:18,h:130}, {x:430,y:148,w:108,h:18}, {x:520,y:290,w:18,h:150},
  ];
  const items = [
    {x:80,y:60,r:8,taken:false}, {x:150,y:380,r:8,taken:false}, {x:370,y:60,r:8,taken:false},
    {x:650,y:80,r:8,taken:false}, {x:640,y:370,r:8,taken:false},
  ];
  const guards = [
    {x:60,y:220,w:22,h:22, axis:'x', min:40, max:220, speed:1.0, dir:1},
    {x:390,y:60,w:22,h:22, axis:'y', min:40, max:400, speed:0.9, dir:1},
    {x:600,y:220,w:22,h:22, axis:'x', min:560, max:740, speed:1.1, dir:-1},
  ];
  return { walls, items, guards, door:o.door, start:{x:40,y:230},
    accent:'#39ff6e', dim:'#0f6b2c', guardCol:'#ff3b3b',
    camLabel:'CAM-01 · 국립 박물관', label:'박물관', hint:'DOOR LOCKED :: 전시품 5점을 모두 회수하세요' };
}

function buildSchool(){
  const o = outerWithDoor('top', 360, 80);
  const walls = [...o.walls,
    {x:18,y:80,w:220,h:18}, {x:560,y:160,w:222,h:18},
    {x:18,y:240,w:220,h:18}, {x:560,y:320,w:222,h:18},
  ];
  const items = [
    {x:80,y:120,r:8,taken:false}, {x:700,y:200,r:8,taken:false}, {x:400,y:60,r:8,taken:false},
    {x:120,y:360,r:8,taken:false}, {x:680,y:400,r:8,taken:false},
  ];
  const guards = [
    {x:290,y:60,w:22,h:22, axis:'y', min:60, max:400, speed:1.0, dir:1},
    {x:60,y:200,w:22,h:22, axis:'x', min:60, max:740, speed:1.05, dir:1},
    {x:640,y:80,w:22,h:22, axis:'y', min:80, max:380, speed:0.9, dir:-1},
  ];
  return { walls, items, guards, door:o.door, start:{x:400,y:410},
    accent:'#ffb84d', dim:'#7a5217', guardCol:'#ff8c3b',
    camLabel:'CAM-02 · 교실동 복도', label:'학교', hint:'DOOR LOCKED :: 사물함 5곳을 모두 확인하세요' };
}

function buildApartment(){
  const o = outerWithDoor('left', 190, 80);
  const walls = [...o.walls,
    {x:120,y:18,w:18,h:170}, {x:260,y:270,w:18,h:172},
    {x:400,y:18,w:18,h:170}, {x:540,y:270,w:18,h:172}, {x:660,y:18,w:18,h:170},
  ];
  const items = [
    {x:60,y:100,r:8,taken:false}, {x:340,y:220,r:8,taken:false}, {x:480,y:220,r:8,taken:false},
    {x:620,y:100,r:8,taken:false}, {x:700,y:380,r:8,taken:false},
  ];
  const guards = [
    {x:200,y:210,w:22,h:22, axis:'x', min:100, max:700, speed:1.1, dir:1},
    {x:340,y:60,w:22,h:22, axis:'y', min:60, max:400, speed:0.95, dir:1},
    {x:600,y:60,w:22,h:22, axis:'y', min:60, max:400, speed:1.0, dir:-1},
  ];
  return { walls, items, guards, door:o.door, start:{x:740,y:220},
    accent:'#b98bff', dim:'#4a2e7a', guardCol:'#ff3bb0',
    camLabel:'CAM-03 · 아파트 12층 복도', label:'아파트', hint:'DOOR LOCKED :: 세대 물품 5개를 모두 회수하세요' };
}

const STAGES = [null, buildMuseum(), null, null]; // rebuilt fresh on each reset

// ---------- game state ----------
let status = 'start';
let stage = 1;
let itemsCollected = 0;
let flashMsg = '';
let flashTimer = 0;
let player, cur;
let lives = 5;

function updateLivesHUD(){
  livesEl.textContent = 'LIVES ' + '♥'.repeat(Math.max(0,lives)) + '♡'.repeat(Math.max(0,5-lives));
}

function freshStage(n){
  const s = (n===1) ? buildMuseum() : (n===2) ? buildSchool() : buildApartment();
  for(const g of s.guards){ g._ox = g.x; g._oy = g.y; g._odir = g.dir; }
  return s;
}

function applyTheme(){
  document.documentElement.style.setProperty('--phosphor', cur.accent);
  document.documentElement.style.setProperty('--phosphor-dim', cur.dim);
  camIdEl.textContent = cur.camLabel;
  tagLineEl.textContent = `SECURITY MONITORING SYSTEM // STAGE ${stage} of 3 · ${cur.label}`;
  segEls.forEach((seg,i)=>{
    seg.classList.remove('active','done');
    if(i < stage-1) seg.classList.add('done');
    else if(i === stage-1) seg.classList.add('active');
  });
}

function resetAll(){
  stage = 1;
  itemsCollected = 0;
  lives = 5;
  cur = freshStage(1);
  player = {x:cur.start.x, y:cur.start.y, w:18, h:18, speed:1.8};
  evidEl.textContent = 'EVIDENCE 0/5';
  updateLivesHUD();
  applyTheme();
}
resetAll();

function startGame(){ resetAll(); status = 'play'; }
function gameOver(reason){ status = 'caught'; flashMsg = reason; }
function winGame(){ status = 'win'; }

// hit by a guard: lose a life and respawn at the CURRENT stage's start point,
// keeping items already collected in this stage. Only a full life loss restarts from Stage 1.
function loseLife(reason){
  lives--;
  updateLivesHUD();
  if(lives <= 0){
    gameOver(reason + ' :: 목숨 소진');
    return;
  }
  player = {x:cur.start.x, y:cur.start.y, w:18, h:18, speed:1.8};
  for(const g of cur.guards){ g.x = g._ox; g.y = g._oy; g.dir = g._odir; }
  flashMsg = reason + ` :: 남은 목숨 ${lives}`;
  flashTimer = 90;
}

function goToStage(n, enterMsg){
  stage = n;
  cur = freshStage(n);
  itemsCollected = 0;
  player = {x:cur.start.x, y:cur.start.y, w:18, h:18, speed:1.8};
  evidEl.textContent = 'EVIDENCE 0/5';
  flashMsg = enterMsg;
  flashTimer = 100;
  applyTheme();
}

// ---------- update ----------
function movePlayer(walls){
  let dx=0, dy=0;
  if(keys['arrowup']||keys['w']) dy -= player.speed;
  if(keys['arrowdown']||keys['s']) dy += player.speed;
  if(keys['arrowleft']||keys['a']) dx -= player.speed;
  if(keys['arrowright']||keys['d']) dx += player.speed;
  const tryX = {x:player.x+dx, y:player.y, w:player.w, h:player.h};
  if(!collidesWalls(tryX, walls)) player.x = Math.max(0, Math.min(W-player.w, tryX.x));
  const tryY = {x:player.x, y:player.y+dy, w:player.w, h:player.h};
  if(!collidesWalls(tryY, walls)) player.y = Math.max(0, Math.min(H-player.h, tryY.y));
}

function updateGuard(g){
  const delta = g.speed * g.dir;
  if(g.axis === 'x'){
    g.x += delta;
    if(g.x < g.min || g.x > g.max){ g.dir *= -1; g.x = Math.max(g.min, Math.min(g.max, g.x)); }
  } else {
    g.y += delta;
    if(g.y < g.min || g.y > g.max){ g.dir *= -1; g.y = Math.max(g.min, Math.min(g.max, g.y)); }
  }
}

function update(){
  if(status !== 'play') return;
  movePlayer(cur.walls);

  for(const it of cur.items){
    if(it.taken) continue;
    const dx = (player.x+player.w/2) - it.x, dy=(player.y+player.h/2)-it.y;
    if(Math.hypot(dx,dy) < it.r + 12){
      it.taken = true;
      itemsCollected++;
      evidEl.textContent = `EVIDENCE ${itemsCollected}/5`;
    }
  }

  for(const g of cur.guards){
    updateGuard(g);
    if(rectsOverlap(player, g)){ loseLife(`${cur.label}에서 발각됨`); return; }
  }

  if(rectsOverlap(player, cur.door) && itemsCollected >= 5){
    if(stage === 1) goToStage(2, 'CAM-02 :: 학교 진입');
    else if(stage === 2) goToStage(3, 'CAM-03 :: 아파트 진입');
    else winGame();
  }
}

// ---------- draw ----------
function drawFloor(){
  ctx.fillStyle = '#04120a';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  for(let x=0;x<W;x+=26){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=26){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}
function drawWalls(walls){
  for(const w of walls){
    ctx.fillStyle = '#0c1a12';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = '#1f3327';
    ctx.lineWidth = 1;
    ctx.strokeRect(w.x+.5, w.y+.5, w.w-1, w.h-1);
  }
}
function drawPlayer(){
  ctx.save();
  ctx.shadowColor = cur.accent; ctx.shadowBlur = 12;
  ctx.strokeStyle = cur.accent; ctx.lineWidth = 2;
  ctx.strokeRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = cur.accent + '40';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.restore();
}
function drawItem(it){
  if(it.taken) return;
  const blink = Math.sin(Date.now()/180) > -0.3;
  if(!blink) return;
  ctx.save();
  ctx.shadowColor = cur.accent; ctx.shadowBlur = 10;
  ctx.strokeStyle = cur.accent; ctx.lineWidth = 1.5;
  ctx.strokeRect(it.x-9, it.y-9, 18, 18);
  ctx.font = "10px 'VT323', monospace";
  ctx.fillStyle = cur.accent; ctx.textAlign = 'center';
  ctx.fillText('EVD', it.x, it.y+3);
  ctx.restore();
}
function drawGuard(g){
  ctx.save();
  ctx.shadowColor = cur.guardCol; ctx.shadowBlur = 10;
  ctx.fillStyle = cur.guardCol + 'd9';
  ctx.fillRect(g.x, g.y, g.w, g.h);
  ctx.strokeStyle = cur.guardCol;
  ctx.strokeRect(g.x, g.y, g.w, g.h);
  ctx.restore();
}
function drawDoor(door, open){
  ctx.save();
  const stripeCol = open ? cur.accent : '#3a4038';
  ctx.fillStyle = stripeCol;
  const bx = door.x-4, by = door.y-4, bw = door.w+8, bh = door.h+8;
  ctx.fillRect(bx,by,bw,bh);
  for(let i=-bh;i<bw+bh;i+=10){
    ctx.beginPath(); ctx.moveTo(bx+i, by); ctx.lineTo(bx+i-bh, by+bh);
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 4; ctx.stroke();
  }
  if(open){ ctx.shadowColor = cur.accent; ctx.shadowBlur = 16; ctx.strokeRect(bx,by,bw,bh); }
  ctx.restore();
}
function drawOverlay(title, sub, tint){
  ctx.save();
  ctx.fillStyle = tint || 'rgba(2,4,2,0.85)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = cur.accent; ctx.shadowColor = cur.accent; ctx.shadowBlur = 14;
  ctx.font = "36px 'VT323', monospace";
  ctx.fillText(title, W/2, H/2 - 8);
  ctx.shadowBlur = 0;
  ctx.font = "18px 'Noto Sans KR', sans-serif";
  ctx.fillStyle = '#cfead9';
  ctx.fillText(sub, W/2, H/2 + 24);
  ctx.restore();
}

function draw(){
  drawFloor();
  if(status === 'start'){
    drawOverlay('무단 침입 감지 대기중', '아무 키나 눌러 잠입 시작 — 목숨 5개, 발각되면 그 자리부터 재개');
    return;
  }
  drawWalls(cur.walls);
  for(const it of cur.items) drawItem(it);
  for(const g of cur.guards) drawGuard(g);
  drawDoor(cur.door, itemsCollected >= 5);
  drawPlayer();
  if(itemsCollected < 5){
    ctx.fillStyle = 'rgba(255,204,51,0.55)';
    ctx.font = "13px 'VT323', monospace";
    ctx.textAlign = 'right';
    ctx.fillText(cur.hint, W-20, 24);
  }
  if(flashTimer > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(1, flashTimer/30);
    ctx.textAlign = 'center';
    ctx.fillStyle = cur.accent;
    ctx.font = "22px 'VT323', monospace";
    ctx.fillText(flashMsg, W/2, 46);
    ctx.restore();
    flashTimer--;
  }
  if(status === 'caught'){
    drawOverlay('SUBJECT LOST', flashMsg + ' — 아무 키나 눌러 처음부터 재시작', 'rgba(40,4,4,0.82)');
  } else if(status === 'win'){
    drawOverlay('TAPE ENDS :: 3개 구역 탈출 성공', '박물관·학교·아파트를 모두 빠져나왔습니다 — 아무 키나 눌러 다시 플레이', 'rgba(4,30,14,0.82)');
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
