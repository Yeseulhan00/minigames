<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>좀비 서바이버</title>
<style>
  :root{
    --bg-deep:#0a0d08;
    --panel:#141a10;
    --line:#2a3520;
    --ink:#eef2e6;
    --sub:#8a9478;
    --accent:#9ee36b;
    --accent2:#ff5d5d;
    --gold:#ffd166;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, #1c2416 0%, transparent 50%),
      radial-gradient(circle at 85% 100%, #1a1410 0%, transparent 50%),
      var(--bg-deep);
    color:var(--ink);
    font-family:'Courier New', ui-monospace, monospace;
    overflow:hidden;
    touch-action:none;
  }
  .wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:12px 10px 8px;
  }
  h1{
    margin:0 0 2px;
    font-size:20px;
    letter-spacing:3px;
    font-weight:800;
    color:var(--ink);
    text-shadow:0 0 12px rgba(158,227,107,0.4);
  }
  h1 span{color:var(--accent2);}
  .tagline{
    font-size:10px;
    letter-spacing:3px;
    color:var(--sub);
    margin-bottom:10px;
    text-transform:uppercase;
  }
  .hud{
    display:flex;
    gap:8px;
    width:100%;
    max-width:380px;
    margin-bottom:8px;
    justify-content:space-between;
  }
  .hud-item{
    background:rgba(158,227,107,0.06);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 10px;
    font-size:11px;
    display:flex;
    align-items:center;
    gap:6px;
    flex:1;
    justify-content:center;
  }
  .hud-item b{color:var(--accent);font-size:14px;}
  #hearts{letter-spacing:2px;font-size:13px;}
  .board-frame{
    position:relative;
    border:2px solid var(--line);
    border-radius:10px;
    background:#0c0f08;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.85), inset 0 0 40px rgba(158,227,107,0.04);
    overflow:hidden;
  }
  #gameCanvas{
    display:block;
  }
  .overlay{
    position:absolute;
    inset:0;
    background:rgba(8,10,6,0.9);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    padding:20px;
  }
  .overlay.hidden{display:none;}
  .overlay .big{
    font-size:20px;
    letter-spacing:2px;
    color:var(--accent2);
    font-weight:800;
    text-shadow:0 0 14px rgba(255,93,93,0.5);
  }
  .overlay .small{
    font-size:11px;
    color:#c3cdb3;
    line-height:1.8;
    max-width:250px;
  }
  .btn{
    margin-top:6px;
    background:var(--accent);
    color:#111a0a;
    border:none;
    padding:11px 26px;
    font-family:inherit;
    font-weight:800;
    font-size:12px;
    letter-spacing:2px;
    border-radius:22px;
    cursor:pointer;
    box-shadow:0 4px 0 #5d8f3e;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #5d8f3e;}
  .hintline{
    font-size:10px;
    color:var(--sub);
    margin-top:10px;
    letter-spacing:0.5px;
    text-align:center;
  }
  .home{
    position:fixed; left:10px; bottom:10px; z-index:20;
    font-size:10px; letter-spacing:1px; text-decoration:none;
    color:var(--sub); background:rgba(0,0,0,0.35);
    border:1px solid var(--line); border-radius:8px;
    padding:5px 10px;
  }
  .home:hover{ color:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>
<a class="home" href="../index.html">← 목록으로</a>
<div class="wrap">
  <h1>ZOMBIE <span>SURVIVOR</span></h1>
  <div class="tagline">사람이 직접 총을 쏩니다</div>

  <div class="hud">
    <div class="hud-item">SCORE <b id="scoreVal">0</b></div>
    <div class="hud-item">WAVE <b id="waveVal">1</b></div>
    <div class="hud-item" id="hearts">❤️❤️❤️</div>
  </div>

  <div class="board-frame">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay" id="overlay">
      <div class="big" id="overlayTitle">ZOMBIE SURVIVOR</div>
      <div class="small" id="overlayText">
        화면을 드래그해서 이동하세요.<br>
        가장 가까운 좀비를 향해 자동으로 총을 쏩니다!<br>
        웨이브가 오를수록 좀비가 강해져요 🧟
      </div>
      <button class="btn" id="startBtn">시작하기</button>
    </div>
  </div>

  <div class="hintline">드래그로 이동 · PC는 방향키/WASD로 이동</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const scoreVal = document.getElementById('scoreVal');
  const waveVal = document.getElementById('waveVal');
  const heartsEl = document.getElementById('hearts');

  let W = 380, H = 560;
  function resize(){
    const maxW = Math.min(window.innerWidth - 24, 380);
    const maxH = window.innerHeight - 230;
    const scale = Math.min(maxW/380, Math.max(maxH,300)/560, 1);
    W = Math.floor(380*scale);
    H = Math.floor(560*scale);
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  function rand(a,b){ return a + Math.random()*(b-a); }
  function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2, y1-y2); }

  // ---------- state ----------
  let player, bullets, enemyBullets, enemies, grassDots, particles, powerups;
  let score, lives, wave, running, gameOver, invincible, fireTimer, spawnTimer, waveEnemiesLeft, waveMessageTimer;
  let keys = {};
  let dragging = false, dragX = 0, dragY = 0;
  let spreadTimer = 0;
  let maxLives = 3;
  let muzzleFlash = 0;

  function resetState(){
    player = { x: W/2, y: H/2, r: 13, speed: 4.4, aim: -Math.PI/2, moveDir: -1 };
    bullets = [];
    enemyBullets = [];
    enemies = [];
    grassDots = [];
    particles = [];
    powerups = [];
    score = 0;
    lives = 3;
    maxLives = 3;
    wave = 1;
    invincible = 60;
    fireTimer = 0;
    spawnTimer = 0;
    spreadTimer = 0;
    waveMessageTimer = 90;
    waveEnemiesLeft = enemiesForWave(wave);
    for(let i=0;i<60;i++){
      grassDots.push({x:rand(0,W), y:rand(0,H), s:rand(1,2.4)});
    }
    updateHUD();
  }

  function enemiesForWave(w){
    return 6 + w*3;
  }

  function updateHUD(){
    scoreVal.textContent = score;
    waveVal.textContent = wave;
    heartsEl.textContent = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(Math.max(maxLives-lives,0));
  }

  function startGame(){
    resetState();
    running = true;
    gameOver = false;
    overlay.classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    gameOver = true;
    overlayTitle.textContent = 'GAME OVER';
    overlayText.innerHTML = `최종 점수 <b style="color:#9ee36b">${score}</b><br>도달 웨이브 ${wave}`;
    startBtn.textContent = '다시 시작';
    overlay.classList.remove('hidden');
  }

  // ---------- input ----------
  document.addEventListener('keydown', (e)=>{
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
  });
  document.addEventListener('keyup', (e)=>{ keys[e.code] = false; });

  function getCanvasPos(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (canvas.width/rect.width),
      y: (clientY - rect.top) * (canvas.height/rect.height)
    };
  }

  canvas.addEventListener('touchstart', (e)=>{
    e.preventDefault();
    if(!running) return;
    const t = e.touches[0];
    const p = getCanvasPos(t.clientX, t.clientY);
    dragging = true; dragX = p.x; dragY = p.y;
  }, {passive:false});
  canvas.addEventListener('touchmove', (e)=>{
    e.preventDefault();
    if(!running) return;
    const t = e.touches[0];
    const p = getCanvasPos(t.clientX, t.clientY);
    dragX = p.x; dragY = p.y;
  }, {passive:false});
  canvas.addEventListener('touchend', (e)=>{ dragging = false; });

  canvas.addEventListener('mousedown', (e)=>{
    const p = getCanvasPos(e.clientX, e.clientY);
    dragging = true; dragX = p.x; dragY = p.y;
  });
  canvas.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    const p = getCanvasPos(e.clientX, e.clientY);
    dragX = p.x; dragY = p.y;
  });
  window.addEventListener('mouseup', ()=>{ dragging = false; });

  startBtn.addEventListener('click', startGame);

  // ---------- spawning ----------
  function spawnEnemy(){
    const edge = Math.floor(rand(0,4));
    let x,y;
    if(edge===0){ x = rand(0,W); y = -25; }
    else if(edge===1){ x = rand(0,W); y = H+25; }
    else if(edge===2){ x = -25; y = rand(0,H); }
    else { x = W+25; y = rand(0,H); }

    const roll = Math.random();
    let type = 'shambler';
    if(wave >= 2 && roll > 0.65) type = 'spitter';
    if(wave >= 4 && roll > 0.9) type = 'brute';

    let e;
    if(type === 'shambler'){
      e = { type, x, y, r:12, hp:1, speed: rand(0.9,1.4)+wave*0.05, score:10, shootTimer:0 };
    } else if(type === 'spitter'){
      e = { type, x, y, r:12, hp:2, speed: rand(0.7,1.0)+wave*0.03, score:25, shootTimer: rand(50,110) };
    } else {
      e = { type, x, y, r:18, hp:6, speed: rand(0.5,0.7)+wave*0.02, score:60, shootTimer:0 };
    }
    enemies.push(e);
  }

  function spawnPowerup(x,y){
    if(Math.random() < 0.18){
      powerups.push({x,y,r:10,type:'spread',life:600});
    } else if(Math.random() < 0.1){
      powerups.push({x,y,r:10,type:'heart',life:600});
    }
  }

  function spawnParticles(x,y,color,count){
    for(let i=0;i<count;i++){
      particles.push({
        x,y,
        vx: rand(-3,3), vy: rand(-3,3),
        life: 20+Math.random()*15,
        color
      });
    }
  }

  // ---------- update ----------
  let lastTime = 0;
  function update(delta){
    const dtScale = delta/16.67;
    if(invincible > 0) invincible--;
    if(spreadTimer > 0) spreadTimer--;
    if(waveMessageTimer > 0) waveMessageTimer--;
    if(muzzleFlash > 0) muzzleFlash--;

    // player movement
    let dx=0, dy=0;
    if(keys['ArrowLeft']||keys['KeyA']) dx -= 1;
    if(keys['ArrowRight']||keys['KeyD']) dx += 1;
    if(keys['ArrowUp']||keys['KeyW']) dy -= 1;
    if(keys['ArrowDown']||keys['KeyS']) dy += 1;
    let moved = false;
    if(dx!==0||dy!==0){
      const len = Math.hypot(dx,dy);
      player.x += (dx/len)*player.speed*dtScale;
      player.y += (dy/len)*player.speed*dtScale;
      moved = true;
      if(dx !== 0) player.moveDir = dx > 0 ? 1 : -1;
    } else if(dragging){
      const ddx = dragX - player.x, ddy = dragY - player.y;
      const d = Math.hypot(ddx,ddy);
      if(d > 3){
        const step = Math.min(d, player.speed*1.7*dtScale);
        player.x += (ddx/d)*step;
        player.y += (ddy/d)*step;
        moved = true;
        if(Math.abs(ddx) > 2) player.moveDir = ddx > 0 ? 1 : -1;
      }
    }
    player.x = Math.max(player.r+4, Math.min(W-player.r-4, player.x));
    player.y = Math.max(player.r+4, Math.min(H-player.r-4, player.y));

    // find nearest enemy for auto-aim
    let nearest = null, nearestD = Infinity;
    for(const e of enemies){
      const d = dist(player.x,player.y,e.x,e.y);
      if(d < nearestD){ nearestD = d; nearest = e; }
    }
    if(nearest){
      player.aim = Math.atan2(nearest.y-player.y, nearest.x-player.x);
    }

    // firing (auto, only when a target exists)
    fireTimer -= dtScale;
    if(fireTimer <= 0 && nearest){
      fireTimer = spreadTimer > 0 ? 7 : 11;
      muzzleFlash = 6;
      const gx = player.x + Math.cos(player.aim)*18;
      const gy = player.y + Math.sin(player.aim)*18;
      if(spreadTimer > 0){
        const spread = 0.22;
        for(const off of [-spread,0,spread]){
          const a = player.aim + off;
          bullets.push({x:gx, y:gy, vx:Math.cos(a)*9, vy:Math.sin(a)*9, r:4});
        }
      } else {
        bullets.push({x:gx, y:gy, vx:Math.cos(player.aim)*9.5, vy:Math.sin(player.aim)*9.5, r:4});
      }
    }

    // bullets move
    for(let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.x += b.vx*dtScale; b.y += b.vy*dtScale;
      if(b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20) bullets.splice(i,1);
    }
    for(let i=enemyBullets.length-1;i>=0;i--){
      const b = enemyBullets[i];
      b.x += b.vx*dtScale; b.y += b.vy*dtScale;
      if(b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20) enemyBullets.splice(i,1);
    }

    // spawn enemies
    spawnTimer -= dtScale;
    if(spawnTimer <= 0 && waveEnemiesLeft > 0){
      spawnTimer = Math.max(20, 52 - wave*2);
      spawnEnemy();
      waveEnemiesLeft--;
    }

    // enemies move toward player & shoot
    for(let i=enemies.length-1;i>=0;i--){
      const e = enemies[i];
      const d = dist(e.x,e.y,player.x,player.y);
      const shouldAdvance = !(e.type === 'spitter' && d < 150);
      if(shouldAdvance && d > 1){
        e.x += (player.x-e.x)/d * e.speed * dtScale;
        e.y += (player.y-e.y)/d * e.speed * dtScale;
      }
      if(e.type === 'spitter'){
        e.shootTimer -= dtScale;
        if(e.shootTimer <= 0){
          e.shootTimer = rand(70,120);
          const ang = Math.atan2(player.y-e.y, player.x-e.x);
          enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(ang)*3.4, vy:Math.sin(ang)*3.4, r:4});
        }
      }
      // collide with player
      if(invincible<=0 && dist(e.x,e.y,player.x,player.y) < e.r+player.r*0.7){
        enemies.splice(i,1);
        playerHit();
        continue;
      }
    }

    // bullet vs enemy
    for(let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      let hit = false;
      for(let j=enemies.length-1;j>=0;j--){
        const e = enemies[j];
        if(dist(b.x,b.y,e.x,e.y) < e.r+b.r){
          e.hp--;
          spawnParticles(b.x,b.y,'#9ee36b',4);
          hit = true;
          if(e.hp <= 0){
            score += e.score;
            spawnParticles(e.x,e.y,'#ff5d5d',14);
            spawnPowerup(e.x,e.y);
            enemies.splice(j,1);
          }
          break;
        }
      }
      if(hit) bullets.splice(i,1);
    }

    // enemy bullets vs player
    for(let i=enemyBullets.length-1;i>=0;i--){
      const b = enemyBullets[i];
      if(invincible<=0 && dist(b.x,b.y,player.x,player.y) < b.r+player.r*0.6){
        enemyBullets.splice(i,1);
        playerHit();
      }
    }

    // powerups
    for(let i=powerups.length-1;i>=0;i--){
      const p = powerups[i];
      p.life -= dtScale;
      if(p.life <= 0){ powerups.splice(i,1); continue; }
      if(dist(p.x,p.y,player.x,player.y) < p.r+player.r){
        if(p.type === 'spread'){ spreadTimer = 480; }
        else if(p.type === 'heart'){ lives = Math.min(maxLives, lives+1); updateHUD(); }
        spawnParticles(p.x,p.y, p.type==='spread' ? '#ffd166':'#ff5d5d', 10);
        powerups.splice(i,1);
      }
    }

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dtScale; p.y += p.vy*dtScale;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= dtScale;
      if(p.life <= 0) particles.splice(i,1);
    }

    // wave clear check
    if(waveEnemiesLeft <= 0 && enemies.length === 0){
      wave++;
      waveEnemiesLeft = enemiesForWave(wave);
      waveMessageTimer = 90;
      score += 50;
      updateHUD();
    }

    updateHUD();
  }

  function playerHit(){
    if(invincible > 0) return;
    lives--;
    invincible = 90;
    spawnParticles(player.x, player.y, '#ff5d5d', 16);
    updateHUD();
    if(lives <= 0){
      // 죽은 자리에서 바로 부활 (게임 오버 대신)
      revivePlayer();
    }
  }

  function revivePlayer(){
    lives = maxLives;
    invincible = 150;
    spawnParticles(player.x, player.y, '#ffd166', 20);
    updateHUD();
  }

  // ---------- draw ----------
  function drawBackground(){
    ctx.fillStyle = '#182213';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(158,227,107,0.06)';
    for(const d of grassDots){
      ctx.fillRect(d.x, d.y, d.s, d.s);
    }
    // vignette
    const grad = ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.75);
    grad.addColorStop(0,'rgba(0,0,0,0)');
    grad.addColorStop(1,'rgba(0,0,0,0.45)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
  }

  function drawPlayer(){
    if(invincible > 0 && Math.floor(invincible/5)%2===0){
      ctx.globalAlpha = 0.35;
    }
    const x = player.x, y = player.y;

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(x, y+16, 13, 5, 0, 0, Math.PI*2);
    ctx.fill();

    // gun (drawn behind/aligned to aim angle, from body center outward)
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(player.aim);
    ctx.fillStyle = '#3b3f36';
    ctx.fillRect(6, -2.5, 20, 5);
    if(muzzleFlash > 0){
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(26,0);
      ctx.lineTo(34,-5);
      ctx.lineTo(34,5);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // legs
    const walkBob = Math.sin(performance.now()/90) * 3;
    ctx.fillStyle = '#3d4a63';
    ctx.fillRect(x-7, y+4, 5, 11+Math.abs(walkBob)*0.4);
    ctx.fillRect(x+2, y+4, 5, 11-Math.abs(walkBob)*0.4);

    // body
    ctx.fillStyle = '#4f7a3c';
    ctx.beginPath();
    ctx.ellipse(x, y-2, 11, 13, 0, 0, Math.PI*2);
    ctx.fill();

    // head
    ctx.fillStyle = '#e0b18c';
    ctx.beginPath();
    ctx.arc(x, y-19, 8, 0, Math.PI*2);
    ctx.fill();

    // cap
    ctx.fillStyle = '#3d4a63';
    ctx.beginPath();
    ctx.arc(x, y-21, 8.2, Math.PI, Math.PI*2);
    ctx.fill();
    ctx.fillRect(x-8, y-21, 16, 3);

    ctx.globalAlpha = 1;
  }

  function drawEnemy(e){
    ctx.save();
    ctx.translate(e.x, e.y);
    let color = '#5c7a4a';
    if(e.type==='spitter') color = '#8a5c9e';
    if(e.type==='brute') color = '#6e4a35';

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, e.r*0.7, e.r*0.8, e.r*0.3, 0, 0, Math.PI*2);
    ctx.fill();

    // body
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0,0,e.r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // eyes
    ctx.fillStyle = '#ff5d5d';
    ctx.beginPath();
    ctx.arc(-e.r*0.3,-e.r*0.15,1.6,0,Math.PI*2);
    ctx.arc(e.r*0.3,-e.r*0.15,1.6,0,Math.PI*2);
    ctx.fill();

    if(e.type==='brute'){
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.font='bold 10px monospace';
      ctx.textAlign='center';
      ctx.fillText(e.hp, 0, e.r+12);
    }
    ctx.restore();
  }

  function drawBullet(b, color){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
  }

  function drawPowerup(p){
    ctx.save();
    ctx.translate(p.x,p.y);
    const pulse = 1 + Math.sin(performance.now()/150)*0.08;
    ctx.scale(pulse,pulse);
    ctx.fillStyle = p.type==='spread' ? '#ffd166' : '#ff5d5d';
    ctx.beginPath();
    ctx.arc(0,0,p.r,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#0c0f08';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.type==='spread' ? 'S' : '+', 0, 3.5);
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      ctx.globalAlpha = Math.max(0, p.life/30);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.5,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw(){
    drawBackground();
    for(const p of powerups) drawPowerup(p);
    for(const b of enemyBullets) drawBullet(b, '#ff5d5d');
    for(const b of bullets) drawBullet(b, '#9ee36b');
    for(const e of enemies) drawEnemy(e);
    drawPlayer();
    drawParticles();

    if(waveMessageTimer > 0){
      ctx.save();
      ctx.globalAlpha = Math.min(1, waveMessageTimer/30);
      ctx.fillStyle = '#9ee36b';
      ctx.font = 'bold 20px monospace';
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 4;
      ctx.strokeText(`WAVE ${wave}`, W/2, H*0.4);
      ctx.fillText(`WAVE ${wave}`, W/2, H*0.4);
      ctx.restore();
    }
  }

  function loop(t){
    if(!running) return;
    const delta = Math.min(t - lastTime, 40);
    lastTime = t;
    update(delta);
    draw();
    requestAnimationFrame(loop);
  }

  // initial idle screen
  resetState();
  draw();
})();
</script>
</body>
</html>
