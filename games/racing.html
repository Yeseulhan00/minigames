<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스피드 서킷 3D</title>
<style>
  :root{
    --panel:rgba(14,19,30,.86);
    --line:#2e3a52;
    --ink:#eef2fb;
    --sub:#9aa6c4;
    --accent:#ff3b30;
    --accent2:#ffd24a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{
    height:100%;margin:0;background:#070c15;color:var(--ink);overflow:hidden;
    font-family:'Trebuchet MS','Segoe UI','Malgun Gothic',sans-serif;touch-action:none;
  }
  #stage{position:fixed;inset:0;}
  canvas#gl{display:block;width:100%;height:100%;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;}
  #hud.on{opacity:1;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:8px 12px;backdrop-filter:blur(6px);box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  .lbl{font-size:10px;letter-spacing:2px;color:var(--sub);text-transform:uppercase;}
  .val{font-size:22px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;}

  .home{
    position:fixed; left:10px; top:calc(10px + env(safe-area-inset-top)); z-index:25;
    font-size:10px; letter-spacing:1px; text-decoration:none;
    color:var(--sub); background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:5px 10px;
  }
  .home:hover{ color:var(--accent2); border-color:var(--accent2); }

  #hLap{position:absolute;top:calc(41px + env(safe-area-inset-top));left:10px;}
  #hPos{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;text-align:right;}
  #hTime{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;}
  #hTime .val{font-size:18px;}
  #hTime .sub{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;}

  #speedo{
    position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));
    width:140px;text-align:center;
  }
  #speedo .num{font-size:40px;font-weight:900;line-height:.95;font-variant-numeric:tabular-nums;}
  #speedo .unit{font-size:10px;letter-spacing:3px;color:var(--sub);}
  #bar{height:7px;border-radius:4px;background:#1d2637;margin-top:7px;overflow:hidden;}
  #barFill{height:100%;width:0%;background:linear-gradient(90deg,#3ddc84,#ffd24a 62%,#ff3b30);transition:width .08s linear;}

  #mapWrap{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;}
  #map{display:block;width:124px;height:124px;}

  #warn{
    position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);
    font-size:26px;font-weight:900;color:#ff5a4a;letter-spacing:3px;
    text-shadow:0 0 18px rgba(255,60,40,.7);display:none;
  }
  #warn.on{display:block;animation:blink .5s steps(2,end) infinite;}
  @keyframes blink{50%{opacity:.15}}

  #board{
    position:absolute;left:50%;top:78px;transform:translateX(-50%);
    min-width:190px;font-size:12px;display:none;
  }
  #board.on{display:block;}
  #board .row{display:flex;justify-content:space-between;gap:10px;padding:1px 0;color:var(--sub);}
  #board .row.me{color:#fff;font-weight:800;}
  #board .row b{font-variant-numeric:tabular-nums;}

  #count{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:110px;font-weight:900;letter-spacing:4px;
    text-shadow:0 8px 40px rgba(0,0,0,.7);opacity:0;
  }
  #count.go{color:#3ddc84;}
  .pop{animation:pop .85s ease-out;}
  @keyframes pop{0%{opacity:0;transform:scale(1.7)}18%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.85)}}

  /* ---------- touch controls ---------- */
  #pad{position:fixed;inset:0;pointer-events:none;display:none;}
  #pad.on{display:block;}
  .btn{
    position:absolute;pointer-events:auto;border:1px solid rgba(255,255,255,.22);
    background:rgba(20,28,44,.55);color:#dfe7fb;border-radius:18px;
    display:flex;align-items:center;justify-content:center;font-weight:800;
    backdrop-filter:blur(4px);
  }
  .btn.act{background:rgba(255,59,48,.55);border-color:#ff6b60;}
  #bL{left:10px; bottom:calc(16px + env(safe-area-inset-bottom));width:74px;height:74px;font-size:30px;}
  #bR{left:90px; bottom:calc(16px + env(safe-area-inset-bottom));width:74px;height:74px;font-size:30px;}
  #bA{right:10px; bottom:calc(16px + env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;font-size:15px;letter-spacing:1px;}
  #bB{right:112px;bottom:calc(16px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;font-size:13px;}
  #bD{right:112px;bottom:calc(100px + env(safe-area-inset-bottom));width:74px;height:42px;font-size:12px;}

  /* 터치 기기: 하단은 버튼 전용, 계기판과 미니맵은 상단으로 */
  body.touch #speedo{top:calc(97px + env(safe-area-inset-top));bottom:auto;width:104px;}
  body.touch #speedo .num{font-size:28px;}
  body.touch #bar{height:5px;margin-top:5px;}
  body.touch #mapWrap{top:calc(66px + env(safe-area-inset-top));bottom:auto;}
  body.touch #map{width:88px;height:88px;}

  /* ---------- overlays ---------- */
  .screen{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:22px;background:radial-gradient(circle at 50% 35%,rgba(22,32,52,.82),rgba(5,8,14,.95));
    backdrop-filter:blur(3px);z-index:20;
  }
  .screen.hide{display:none;}
  h1{
    margin:0;font-size:clamp(28px,8vw,52px);font-weight:900;letter-spacing:3px;
    background:linear-gradient(92deg,#ff3b30,#ffd24a 55%,#7cd6ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tag{margin:-6px 0 4px;color:var(--sub);font-size:13px;letter-spacing:1px;}
  .grp{display:flex;flex-direction:column;gap:6px;align-items:center;}
  .grp .lbl{letter-spacing:3px;}
  .opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .opt{
    padding:9px 16px;border-radius:10px;border:1px solid var(--line);
    background:rgba(20,28,44,.7);color:#cfd8ef;font-size:13px;font-weight:700;cursor:pointer;
  }
  .opt.sel{background:linear-gradient(180deg,#ff4d42,#c9241a);border-color:#ff7b70;color:#fff;}
  #go{
    margin-top:6px;padding:15px 46px;border:0;border-radius:14px;cursor:pointer;
    font-size:19px;font-weight:900;letter-spacing:4px;color:#fff;
    background:linear-gradient(180deg,#ff5247,#c9241a);box-shadow:0 10px 26px rgba(201,36,26,.45);
  }
  #go:active{transform:translateY(2px);}
  .keys{color:var(--sub);font-size:12px;line-height:1.85;text-align:center;max-width:380px;}
  .keys b{color:var(--ink);}
  .kbd{
    display:inline-block;min-width:20px;padding:1px 6px;margin:0 1px;border-radius:5px;
    background:#1c2433;border:1px solid #2f3b54;color:#dfe7fb;font-size:11px;font-weight:700;
  }

  #results{width:min(430px,94vw);}
  #results .rrow{
    display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;
    padding:9px 12px;border-radius:10px;background:rgba(20,28,44,.6);
    border:1px solid var(--line);margin-bottom:6px;font-size:14px;
  }
  #results .rrow.me{border-color:#ff5247;background:rgba(88,20,16,.6);font-weight:800;}
  #results .rk{font-size:17px;font-weight:900;text-align:center;color:var(--accent2);}
  #results .tm{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12px;}
  #results .rrow.me .tm{color:#ffd9d5;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;}

  #snd{
    position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;
    transform:translate(-50%,42px);z-index:15;pointer-events:auto;
    border:1px solid var(--line);background:var(--panel);color:var(--sub);
    border-radius:9px;padding:4px 10px;font-size:11px;cursor:pointer;display:none;
  }
  #snd.on{display:block;}
</style>
</head>
<body>
<a class="home" href="../index.html">← 목록으로</a>
<div id="stage"><canvas id="gl"></canvas></div>

<div id="hud">
  <div id="hLap" class="card"><div class="lbl">LAP</div><div class="val"><span id="lapNow">1</span><span style="font-size:13px;color:var(--sub)">/<span id="lapAll">3</span></span></div></div>
  <div id="hPos" class="card"><div class="lbl">POS</div><div class="val"><span id="posNow">3</span><span style="font-size:13px;color:var(--sub)">/5</span></div></div>
  <div id="hTime" class="card"><div class="lbl">LAP TIME</div><div class="val" id="tCur">0:00.00</div><div class="sub">BEST <span id="tBest">--:--.--</span></div></div>
  <div id="board" class="card"></div>
  <div id="speedo" class="card">
    <div class="num" id="spd">0</div><div class="unit">KM / H</div>
    <div id="bar"><div id="barFill"></div></div>
  </div>
  <div id="mapWrap" class="card"><canvas id="map" width="248" height="248"></canvas></div>
  <div id="warn">⟲ 역주행!</div>
  <div id="count"></div>
</div>

<button id="snd">🔊 소리 켜짐</button>

<div id="pad">
  <div class="btn" id="bL">◀</div>
  <div class="btn" id="bR">▶</div>
  <div class="btn" id="bA">가속</div>
  <div class="btn" id="bB">브레이크</div>
  <div class="btn" id="bD">드리프트</div>
</div>

<div class="screen" id="title">
  <h1>스피드 서킷 3D</h1>
  <div class="tag">5대가 달리는 서킷 · 당신은 <span style="color:#ff5247;font-weight:800">빨간 머신</span></div>
  <div class="grp">
    <div class="lbl">랩 수</div>
    <div class="opts" id="lapOpts">
      <div class="opt" data-v="1">1랩</div>
      <div class="opt" data-v="2">2랩</div>
      <div class="opt sel" data-v="3">3랩</div>
      <div class="opt" data-v="5">5랩</div>
    </div>
  </div>
  <div class="grp">
    <div class="lbl">난이도</div>
    <div class="opts" id="diffOpts">
      <div class="opt" data-v="0">입문</div>
      <div class="opt" data-v="1">쉬움</div>
      <div class="opt sel" data-v="2">보통</div>
      <div class="opt" data-v="3">어려움</div>
    </div>
  </div>
  <button id="go">START</button>
  <div class="keys">
    <b>키보드</b> <span class="kbd">↑</span><span class="kbd">W</span> 가속 ·
    <span class="kbd">↓</span><span class="kbd">S</span> 브레이크/후진<br>
    <span class="kbd">←</span><span class="kbd">→</span> 조향 ·
    <span class="kbd">Space</span> 드리프트 ·
    <span class="kbd">R</span> 코스 복귀 ·
    <span class="kbd">Tab</span> 순위표<br>
    <span style="color:#6f7b98">모바일은 화면 버튼으로 조작합니다. 잔디로 나가도 속도는 그대로입니다.</span>
  </div>
</div>

<div class="screen hide" id="end">
  <h1 id="endTitle">FINISH</h1>
  <div class="tag" id="endSub"></div>
  <div id="results"></div>
  <button id="go2">다시 하기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const wrapPi= a=>{ while(a> Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; };

/* ============================ 트랙 정의 ============================ */
const HALF_W   = 9.5;    // 도로 반폭
const SHOULDER = 6.5;    // 잔디 어깨
const WALL_OFF = HALF_W + SHOULDER;
const N        = 900;    // 중심선 샘플 수

// 각도에 대한 매끄러운 반지름 함수 — 별형(star-convex)이라 자기교차가 없고
// 최소 코너 반경이 약 58m로 유지된다.
const radiusAt = a => 220 + 50*Math.sin(2*a+0.5) + 30*Math.sin(3*a-1.3) + 18*Math.sin(4*a+0.9);
const CTRL_COUNT = 48;

const curve = new THREE.CatmullRomCurve3(
  Array.from({length:CTRL_COUNT}, (_,k)=>{
    const a = k/CTRL_COUNT*Math.PI*2, r = radiusAt(a);
    return new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r);
  }), true, 'catmullrom', 0.5
);

const C = [], T = [], NRM = [];
(function buildCenterline(){
  const raw = curve.getSpacedPoints(N);
  for(let i=0;i<N;i++){ const p=raw[i]; C.push(new THREE.Vector3(p.x,0,p.z)); }
  for(let i=0;i<N;i++){
    const a=C[(i-1+N)%N], b=C[(i+1)%N];
    const t=new THREE.Vector3(b.x-a.x,0,b.z-a.z).normalize();
    T.push(t);
    NRM.push(new THREE.Vector3(-t.z,0,t.x)); // 진행방향 기준 왼쪽
  }
})();

let TRACK_LEN = 0;
for(let i=0;i<N;i++) TRACK_LEN += C[i].distanceTo(C[(i+1)%N]);
const SEG = TRACK_LEN/N;

function locate(pos, hint){
  let best=hint, bd=Infinity;
  for(let k=-34;k<=34;k++){
    const i=(hint+k+N)%N;
    const dx=pos.x-C[i].x, dz=pos.z-C[i].z, d=dx*dx+dz*dz;
    if(d<bd){ bd=d; best=i; }
  }
  return best;
}
function lateralOf(pos,i){ return (pos.x-C[i].x)*NRM[i].x + (pos.z-C[i].z)*NRM[i].z; }
function curvature(i, span){
  const a=T[i], b=T[(i+span)%N];
  const cr=a.x*b.z-a.z*b.x, dt=a.x*b.x+a.z*b.z;
  return Math.abs(Math.atan2(cr,dt)) / (span*SEG);
}

/* ============================ 렌더러 / 씬 ============================ */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc2dbf2, 260, 1000);

const camera = new THREE.PerspectiveCamera(62, 1, 0.5, 3000);

const skyTex = (function(){
  const c=document.createElement('canvas'); c.width=8; c.height=256;
  const g=c.getContext('2d'), grd=g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#1e4d86'); grd.addColorStop(.40,'#6fa9e2');
  grd.addColorStop(.52,'#bcdcf6'); grd.addColorStop(1,'#dce9f2');
  g.fillStyle=grd; g.fillRect(0,0,8,256);
  const tex=new THREE.CanvasTexture(c); tex.flipY=false;
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(1500,24,16),
    new THREE.MeshBasicMaterial({map:tex, side:THREE.BackSide, fog:false, depthWrite:false})
  ));
  return tex;
})();

// 차체 도장에 하늘/지면이 비치도록 작은 환경맵을 굽는다
scene.environment = (function(){
  const es=new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.SphereGeometry(12,20,14),
    new THREE.MeshBasicMaterial({map:skyTex, side:THREE.BackSide})));
  const gr=new THREE.Mesh(new THREE.CircleGeometry(11.6,28),
    new THREE.MeshBasicMaterial({color:0x5c8a4a}));
  gr.rotation.x=-Math.PI/2; gr.position.y=-0.7; es.add(gr);
  const sn=new THREE.Mesh(new THREE.SphereGeometry(2.0,10,8),
    new THREE.MeshBasicMaterial({color:0xfff6e4}));
  sn.position.set(6,8,4); es.add(sn);
  const pm=new THREE.PMREMGenerator(renderer);
  const tex=pm.fromScene(es,0.03).texture;
  pm.dispose();
  return tex;
})();

scene.add(new THREE.HemisphereLight(0xdcecff, 0x3d5236, 0.62));
const sun = new THREE.DirectionalLight(0xfff3dd, 1.25);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 200;
sun.shadow.camera.left=-46; sun.shadow.camera.right=46;
sun.shadow.camera.top=46;  sun.shadow.camera.bottom=-46;
sun.shadow.bias = -0.0012;
scene.add(sun, sun.target);

/* ============================ 트랙 메시 ============================ */
function ribbon(offA, offB, yA, yB, colorFn, mat){
  const pos=new Float32Array(N*6), col=new Float32Array(N*6);
  const idx=[];
  for(let i=0;i<N;i++){
    const c=C[i], n=NRM[i];
    pos[i*6+0]=c.x+n.x*offA; pos[i*6+1]=yA; pos[i*6+2]=c.z+n.z*offA;
    pos[i*6+3]=c.x+n.x*offB; pos[i*6+4]=yB; pos[i*6+5]=c.z+n.z*offB;
    const cc = colorFn ? colorFn(i) : null;
    if(cc){ col[i*6+0]=cc[0];col[i*6+1]=cc[1];col[i*6+2]=cc[2];
            col[i*6+3]=cc[0];col[i*6+4]=cc[1];col[i*6+5]=cc[2]; }
    const j=(i+1)%N;
    idx.push(i*2+1, i*2, j*2,  i*2+1, j*2, j*2+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  if(colorFn) g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.Mesh(g, mat); m.matrixAutoUpdate=false;
  return m;
}

// 잔디 바닥
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(1250, 72),
  new THREE.MeshLambertMaterial({color:0x4b7a3c})
);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.06;
ground.receiveShadow = true;
scene.add(ground);

// 어깨(옅은 잔디) → 아스팔트 → 흰 라인 → 커브
scene.add(ribbon(WALL_OFF, -WALL_OFF, -0.02, -0.02, null,
  new THREE.MeshLambertMaterial({color:0x5d8f47})));

const road = ribbon(HALF_W, -HALF_W, 0, 0, null,
  new THREE.MeshLambertMaterial({color:0x33363d}));
road.receiveShadow = true;
scene.add(road);

scene.add(ribbon( HALF_W-0.35, HALF_W-0.75, 0.012, 0.012, null, new THREE.MeshLambertMaterial({color:0xe8e8ee})));
scene.add(ribbon(-HALF_W+0.75,-HALF_W+0.35, 0.012, 0.012, null, new THREE.MeshLambertMaterial({color:0xe8e8ee})));

const curbCol = i => (Math.floor(i/7)%2===0) ? [0.86,0.16,0.12] : [0.93,0.93,0.95];
const curbMat = new THREE.MeshLambertMaterial({vertexColors:true});
scene.add(ribbon(HALF_W+1.5, HALF_W, 0.10, 0.02, curbCol, curbMat));
scene.add(ribbon(-HALF_W, -HALF_W-1.5, 0.02, 0.10, curbCol, curbMat));

// 중앙 파선
(function dashes(){
  const pos=[], idx=[]; let v=0;
  for(let i=0;i<N;i+=14){
    for(let k=0;k<7;k++){
      const a=(i+k)%N, b=(i+k+1)%N;
      const ca=C[a], na=NRM[a], cb=C[b], nb=NRM[b];
      pos.push(ca.x+na.x*0.22,0.011,ca.z+na.z*0.22,
               ca.x-na.x*0.22,0.011,ca.z-na.z*0.22,
               cb.x-nb.x*0.22,0.011,cb.z-nb.z*0.22,
               cb.x+nb.x*0.22,0.011,cb.z+nb.z*0.22);
      idx.push(v+1,v,v+3, v+1,v+3,v+2); v+=4;
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({color:0xd9dbe4})));
})();

// 벽(가드레일)
const wallCol = i => (Math.floor(i/9)%2===0) ? [0.92,0.93,0.96] : [0.78,0.17,0.14];
const wallMat = new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide});
scene.add(ribbon(WALL_OFF, WALL_OFF, 0, 2.3, wallCol, wallMat));

// 차체는 길이 방향으로 늘어놓은 단면을 이어 붙여 만든다(로프트).
// 각 단면의 폭·바닥·숄더·지붕 높이를 곡선표에서 읽어 스포츠카 실루엣을 만든다.
const CAR_LEN=4.52, CAR_SEC=40, CAR_P=22;
const CAR_W  =[[0,0.84],[0.06,0.92],[0.17,0.96],[0.32,0.90],[0.50,0.88],[0.68,0.91],[0.83,0.96],[0.93,0.85],[1,0.60]];
const CAR_YB =[[0,0.40],[0.05,0.27],[0.90,0.25],[0.96,0.31],[1,0.44]];
const CAR_YT =[[0,0.95],[0.10,0.99],[0.32,0.98],[0.50,0.95],[0.64,0.91],[0.80,0.84],[0.92,0.77],[1,0.68]];
const CAR_CAB=[[0.10,0],[0.19,0.98],[0.27,1.18],[0.36,1.31],[0.45,1.355],[0.55,1.355],[0.63,1.23],[0.70,1.00],[0.76,0]];
const CAR_RW =[[0.19,0.76],[0.30,0.82],[0.45,0.80],[0.58,0.78],[0.70,0.74]];

function curveAt(keys,u){
  if(u<=keys[0][0]) return keys[0][1];
  for(let i=1;i<keys.length;i++){
    const u1=keys[i][0];
    if(u<=u1){
      const u0=keys[i-1][0], t=clamp((u-u0)/(u1-u0),0,1);
      return keys[i-1][1] + (keys[i][1]-keys[i-1][1])*t*t*(3-2*t);
    }
  }
  return keys[keys.length-1][1];
}

function carSection(u){
  const w=curveAt(CAR_W,u), yb=curveAt(CAR_YB,u), yt=curveAt(CAR_YT,u);
  const yr=Math.max(yt, curveAt(CAR_CAB,u));
  const g=clamp((yr-yt)/0.12,0,1);              // 캐빈이 솟은 정도
  const sx=w*0.90;                              // 숄더 폭
  const rw=lerp(sx, Math.min(sx,curveAt(CAR_RW,u)), g);
  const half=[
    [0,             yb-0.015],
    [w*0.50,        yb-0.010],
    [w*0.90,        yb+0.090],
    [w,             yb+0.250],
    [w,             (yb+yt)*0.5+0.03],
    [w*0.985,       yt-0.13],
    [sx+(w-sx)*0.5, yt-0.03],
    [sx,            yt],
    [lerp(sx, rw+0.045, g), lerp(yt, yr-0.25,  g)],
    [rw,            lerp(yt, yr-0.085, g)],
    [rw*0.78,       lerp(yt, yr-0.012, g)],
    [0,             yr]
  ];
  const pts=half.slice();
  for(let i=10;i>=1;i--) pts.push([-half[i][0], half[i][1]]);
  return pts;
}

const CAR_GEO=(function(){
  const pos=[], paintI=[], glassI=[], S=CAR_SEC, P=CAR_P, secs=[];
  for(let i=0;i<S;i++){
    const u=i/(S-1), z=-CAR_LEN/2+u*CAR_LEN, pts=carSection(u);
    secs.push({u,z,pts});
    for(let j=0;j<P;j++) pos.push(pts[j][0], pts[j][1], z);
  }
  for(let i=0;i<S-1;i++){
    const um=(secs[i].u+secs[i+1].u)/2;
    for(let j=0;j<P;j++){
      const j2=(j+1)%P;
      const a=i*P+j, b=i*P+j2, c=(i+1)*P+j2, d=(i+1)*P+j;
      const roof=(j===10||j===11);
      const green=(j>=8&&j<=13) && um>0.205 && um<0.715;
      const glass=green && (roof ? (um>0.605||um<0.345) : true);
      (glass?glassI:paintI).push(a,b,c, a,c,d);
    }
  }
  const cap=pos.length/3;
  for(const [s,dir] of [[0,-1],[S-1,1]]){
    let cy=0; for(const p of secs[s].pts) cy+=p[1];
    pos.push(0, cy/P, secs[s].z);
    const ci=cap+(dir<0?0:1);
    for(let j=0;j<P;j++){
      const j2=(j+1)%P;
      if(dir<0) paintI.push(ci, s*P+j2, s*P+j);
      else      paintI.push(ci, s*P+j,  s*P+j2);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(paintI.concat(glassI));
  geo.addGroup(0, paintI.length, 0);
  geo.addGroup(paintI.length, glassI.length, 1);
  geo.computeVertexNormals();
  return geo;
})();

  for(const p of puffs){
    if(!p.sp.visible) continue;
    p.life+=dt;
    const t=p.life/p.max;
    if(t>=1){ p.sp.visible=false; p.sp.material.opacity=0; continue; }
    p.sp.material.opacity=(1-t)*0.5;
    p.sp.scale.setScalar(1.1+t*4.2);
    p.sp.position.y += dt*1.7;
  }
}

let actx=null, engOsc=[], engGain=null, engFilt=null, soundOn=true;
function initAudio(){
  if(actx) return;
  const AC = window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  actx = new AC();
  engFilt = actx.createBiquadFilter();
  engFilt.type='lowpass'; engFilt.frequency.value=900; engFilt.Q.value=3;
  engGain = actx.createGain(); engGain.gain.value=0;
  engFilt.connect(engGain); engGain.connect(actx.destination);
  for(const d of [0,1.5,-2.2]){
    const o=actx.createOscillator();
    o.type='sawtooth'; o.frequency.value=70; o.detune.value=d*12;
    o.connect(engFilt); o.start();
    engOsc.push(o);
  }
}
function beep(freq, dur, vol){
  if(!actx||!soundOn) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='square'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+dur+0.02);
}
function updateEngine(){
  if(!actx||!engGain) return;
  if(!soundOn || state!=='race'){ engGain.gain.value = lerp(engGain.gain.value,0,0.2); return; }
  const v=player.vel.length();
  const ratio=clamp(v/62,0,1);
  const rpm = 58 + ratio*205 + (player.throttle>0? 14:0);
  for(const o of engOsc) o.frequency.value = rpm;
  engFilt.frequency.value = 480 + ratio*2100;
  const tgt = 0.035 + player.throttle*0.05 + ratio*0.03;
  engGain.gain.value = lerp(engGain.gain.value, tgt, 0.15);
}

  player.steer    = (left?1:0) - (right?1:0);

const _f=new THREE.Vector3(), _r=new THREE.Vector3(), _t=new THREE.Vector3();

function stepCar(car, dt){
  const i = car.si;
  _f.set(Math.sin(car.yaw),0,Math.cos(car.yaw));
  _r.set(_f.z,0,-_f.x);

  let vf = car.vel.dot(_f);
  let vr = car.vel.dot(_r);

  const off = Math.abs(car.lat) > HALF_W + 0.4;
  car.offroad = off;

  let maxLat = car.maxLat;
  if(car.hand) maxLat *= 0.30;

  vf += car.power*car.throttle*dt;
  if(car.brake){
    if(vf > 0.4)      vf = Math.max(0, vf - 31*dt);
    else if(vf > -13) vf -= 11*dt;
  }
  vf -= (0.26*vf + 0.0035*vf*Math.abs(vf))*dt;

  const auth = 1.78/(1+Math.abs(vf)*0.047);
  const eng  = clamp(Math.abs(vf)/3.0, 0, 1) * (vf<0?-1:1);
  car.yaw += car.steer*auth*eng*dt;

  let latAcc = clamp(-vr*7.5, -maxLat, maxLat);
  vr += latAcc*dt;

  car.vel.copy(_f).multiplyScalar(vf).addScaledVector(_r, vr);
  car.pos.addScaledVector(car.vel, dt);

  car.si = locate(car.pos, i);
  car.lat = lateralOf(car.pos, car.si);

  // 벽 충돌
  const over = Math.abs(car.lat) - WALL_OFF + 1.0;
  if(over > 0){
    const sgn = car.lat>0?1:-1;
    car.pos.addScaledVector(NRM[car.si], -over*sgn);
    const outN = _t.copy(NRM[car.si]).multiplyScalar(sgn);
    const vn = car.vel.dot(outN);
    if(vn>0) car.vel.addScaledVector(outN, -vn*1.35);
    car.vel.multiplyScalar(0.90);
    car.lat = lateralOf(car.pos, car.si);
    if(car.player && vn>7) shake = Math.min(1, shake+vn*0.03);
  }

  // 랩 카운트
  if(i > N*0.75 && car.si < N*0.25) onCrossLine(car, 1);
  else if(i < N*0.25 && car.si > N*0.75) car.lap--;

  car.prog = car.lap*N + car.si;

  // 역주행
  car.wrong = car.vel.dot(T[car.si]) < -3 && car.vel.length() > 5;

  // 시각 효과용
  const speed = car.vel.length();
  car.wheelSpin += (vf/0.46)*dt;
  car.roll  = lerp(car.roll,  clamp(-vr*0.018, -0.16, 0.16), 1-Math.pow(0.001,dt));
  car.pitch = lerp(car.pitch, clamp((car.throttle*0.9 - car.brake*1.5)*0.022, -0.05, 0.035), 1-Math.pow(0.001,dt));

  if((Math.abs(vr)>7.5 || (off && speed>9)) && Math.random()<dt*36){
    const bx=car.pos.x - _f.x*1.6, bz=car.pos.z - _f.z*1.6;
    emitPuff(bx + _r.x*(Math.random()*2-1), 0.35, bz + _r.z*(Math.random()*2-1),
             off?0xa88a5c:0xdedede);
  }

  // 코스 이탈 후 정지 상태 감지
  if(off && speed<5) car.stuck += dt; else car.stuck = 0;
  if(car.stuck > 2.5 && !car.player) respawn(car);
}

function respawn(car){
  const i=car.si;
  car.pos.set(C[i].x, 0, C[i].z);
  car.yaw = Math.atan2(T[i].x, T[i].z);
  car.vel.set(0,0,0);
  car.lat = 0; car.stuck = 0;
}

function collide(){
  for(let a=0;a<cars.length;a++) for(let b=a+1;b<cars.length;b++){
    const A=cars[a], B=cars[b];
    const dx=B.pos.x-A.pos.x, dz=B.pos.z-A.pos.z;
    const d=Math.hypot(dx,dz);
    if(d>3.5 || d<1e-4) continue;
    const nx=dx/d, nz=dz/d, push=(3.5-d)*0.5;
    A.pos.x-=nx*push; A.pos.z-=nz*push;
    B.pos.x+=nx*push; B.pos.z+=nz*push;
    const rel=(B.vel.x-A.vel.x)*nx + (B.vel.z-A.vel.z)*nz;
    if(rel<0){
      const j=-rel*0.62;
      A.vel.x-=nx*j; A.vel.z-=nz*j;
      B.vel.x+=nx*j; B.vel.z+=nz*j;
      if((A.player||B.player) && -rel>6) shake=Math.min(1, shake+0.28);
    }
  }
}

/* ============================ AI ============================ */
function driveAI(car, dt){
  const i=car.si;
  const speed = Math.max(0, car.vel.dot(_f.set(Math.sin(car.yaw),0,Math.cos(car.yaw))));

  // 주행 라인
  car.lanePhase += dt*car.wander*0.32;
  let lane = car.laneBase + Math.sin(car.lanePhase)*car.wob;

  // 앞차 회피
  for(const o of cars){
    if(o===car) continue;
    const d=(o.prog-car.prog)*SEG;
    if(d>0 && d<17){
      const dl=o.lat-car.lat;
      if(Math.abs(dl)<4.4) lane -= (dl>=0?1:-1)*(5.0-Math.abs(dl));
    }
  }
  // 코스 밖으로 밀렸으면 중앙선 복귀를 우선한다
  const wide = Math.abs(car.lat) - (HALF_W-3.5);
  if(wide > 0) lane = 0;
  car.lane = clamp(lane, -HALF_W+4, HALF_W-4);

  const look = clamp(13 + speed*0.60*car.lookK - Math.max(0,wide)*1.2, 12, 72);
  const j = (i + Math.round(look/SEG)) % N;
  const tx = C[j].x + NRM[j].x*car.lane, tz = C[j].z + NRM[j].z*car.lane;

  // pure pursuit: 목표점을 지나는 원호의 곡률로 필요한 선회율을 구한다
  const alpha = wrapPi(Math.atan2(tx-car.pos.x, tz-car.pos.z) - car.yaw);
  const kappa = 2*Math.sin(alpha)/Math.max(8, Math.hypot(tx-car.pos.x, tz-car.pos.z));
  const auth  = 1.78/(1+speed*0.047);
  // 그립이 감당하는 선회율 이상으로는 핸들을 꺾지 않는다 (슬라이드 방지)
  const cap = clamp((car.maxLat/Math.max(7,speed))/auth, 0.25, 1);
  car.steer = clamp(kappa*Math.max(7,speed)/auth, -cap, cap);

  // 코너 감속: 전방 각 지점의 국소 곡률로 진입 속도를 잡고 제동거리를 역산
  const win = Math.max(3, Math.round(22/SEG));
  let target = car.topSpeed;
  for(let d=0; d<=170; d+=12){
    const at=(i + Math.round(d/SEG))%N;
    const k=curvature(at, win);
    if(k>1e-4){
      const v=Math.sqrt(car.maxLat*car.safe/k);
      target=Math.min(target, Math.sqrt(v*v + 2*24*d));
    }
  }
  // 러버밴딩(간격 유지)
  const gap=(car.prog-player.prog)*SEG;
  target *= 1 - clamp(gap/900, -1, 1)*RUBBER;

  if(speed > target+1.5){ car.throttle=0; car.brake=1; }
  else if(speed < target-1.0){ car.throttle=1; car.brake=0; }
  else { car.throttle=0.35; car.brake=0; }

  if(car.offroad && speed<14){ car.throttle=1; car.brake=0; }
  car.hand=false;
}

/* ============================ 레이스 상태 ============================ */
let state='title';      // title | countdown | race | done
let LAPS=3, DIFFI=2, RUBBER=0.055;
let raceStart=0, now=0, shake=0, finishedCount=0;

const $ = id => document.getElementById(id);
const hud=$('hud'), boardEl=$('board'), countEl=$('count'), warnEl=$('warn');

function fmt(ms){
  if(!ms||ms<=0) return '--:--.--';
  const t=ms/1000, m=Math.floor(t/60), s=t-m*60;
  return m+':'+(s<10?'0':'')+s.toFixed(2);
}

function gridSetup(){
  const slots=[12,19,26,33,40];
  const cfg=DIFF[DIFFI];
  RUBBER=cfg.rubber;
  cars.forEach((c,k)=>{
    const si=(N - slots[k] + N)%N;
    const off=(k%2===0? -4.6 : 4.6);
    c.si=si;
    c.pos.set(C[si].x + NRM[si].x*off, 0, C[si].z + NRM[si].z*off);
    c.yaw=Math.atan2(T[si].x, T[si].z);
    c.vel.set(0,0,0);
    c.lat=off; c.lap=0; c.prog=c.lap*N+si;
    c.lapStart=0; c.lastLap=0; c.bestLap=0; c.laps=[];
    c.finished=false; c.finishT=0; c.stuck=0;
    c.throttle=0; c.brake=0; c.steer=0; c.hand=false;
    c.roll=0; c.pitch=0; c.wheelSpin=0; c.offroad=false; c.wrong=false;
    if(c.player){
      c.power=30.5; c.maxLat=22.6;
    }else{
      c.power=cfg.power*c.skill;
      c.maxLat=cfg.lat*c.skill;
      c.lookK=cfg.look; c.safe=cfg.safe; c.wob=cfg.wob;
      c.topSpeed=Math.sqrt(c.power/0.0035)*0.98;
      c.laneBase=off*0.35;
      c.lanePhase=Math.random()*6.28;
    }
    syncMesh(c);
  });
  finishedCount=0;
  updateRanks();
}

function onCrossLine(car, dir){
  car.lap += dir;
  if(state!=='race') return;
  if(car.lap>=2){
    const lt = now - car.lapStart;
    car.lastLap=lt; car.laps.push(lt);
    if(!car.bestLap || lt<car.bestLap) car.bestLap=lt;
  }
  car.lapStart = now;
  if(car.lap > LAPS && !car.finished){
    car.finished=true;
    car.finishT = now - raceStart;
    finishedCount++;
    if(car.player){ beep(880,0.16,0.10); setTimeout(()=>beep(1320,0.3,0.09),140); finishRace(); }
  }else if(car.player){
    beep(1046,0.07,0.06);
  }
}

function updateRanks(){
  const sorted=[...cars].sort((a,b)=>{
    if(a.finished&&b.finished) return a.finishT-b.finishT;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.prog-a.prog;
  });
  sorted.forEach((c,k)=> c.rank=k+1);
  return sorted;
}

function startRace(){
  gridSetup();
  $('title').classList.add('hide');
  $('end').classList.add('hide');
  hud.classList.add('on');
  $('snd').classList.add('on');
  $('lapAll').textContent=LAPS;
  initAudio();
  if(actx && actx.state==='suspended') actx.resume();
  state='countdown';
  let n=3;
  const tick=()=>{
    if(n>0){
      countEl.textContent=n; countEl.className='pop';
      beep(620,0.12,0.09);
      void countEl.offsetWidth; countEl.className='pop';
      n--; setTimeout(tick, 900);
    }else{
      countEl.textContent='GO!'; countEl.className='pop go';
      beep(1100,0.3,0.11);
      state='race';
      raceStart=now;
      cars.forEach(c=> c.lapStart=now);
      setTimeout(()=>{ countEl.className=''; countEl.textContent=''; }, 850);
    }
  };
  countEl.className=''; countEl.textContent='';
  setTimeout(tick, 350);
}

function finishRace(){
  state='done';
  const sorted=updateRanks();

  // 미완주 차량은 진행도 순으로 추정 기록
  const list=sorted.map(c=>({c, rank:c.rank}));
  const me=player.rank;
  $('endTitle').textContent = me===1 ? '🏆 WINNER!' : (me<=3 ? 'PODIUM!' : 'FINISH');
  $('endSub').textContent = me===1
    ? '완벽한 주행이었습니다 — 1위!'
    : `${me}위로 완주했습니다 · 최고 랩 ${fmt(player.bestLap)}`;

  const box=$('results'); box.innerHTML='';
  list.forEach(({c,rank})=>{
    const row=document.createElement('div');
    row.className='rrow'+(c.player?' me':'');
    const hex='#'+c.color.toString(16).padStart(6,'0');
    const gap = Math.abs((player.prog-c.prog)*SEG).toFixed(0);
    const time = c.finished ? fmt(c.finishT) : `${gap}m 뒤`;
    row.innerHTML=
      `<div class="rk">${rank}</div>`+
      `<div><span class="dot" style="background:${hex}"></span>${c.player?'나의 머신 (YOU)':c.name}</div>`+
      `<div style="text-align:right"><div class="tm">${time}</div>`+
      `<div class="tm">${c.bestLap?'BEST '+fmt(c.bestLap):''}</div></div>`;
    box.appendChild(row);
  });
  setTimeout(()=>{
    hud.classList.remove('on');
    $('end').classList.remove('hide');
  }, 1400);
}

/* ============================ 옵션 UI ============================ */
function optGroup(id, cb){
  const g=$(id);
  g.addEventListener('click', e=>{
    const o=e.target.closest('.opt'); if(!o) return;
    [...g.children].forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');
    cb(+o.dataset.v);
  });
}
optGroup('lapOpts', v=>LAPS=v);
optGroup('diffOpts', v=>DIFFI=v);
$('go').addEventListener('click', startRace);
$('go2').addEventListener('click', startRace);
$('snd').addEventListener('click', ()=>{
  soundOn=!soundOn;
  $('snd').textContent = soundOn ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
});

/* ============================ 미니맵 ============================ */
const mapCan=$('map'), mctx=mapCan.getContext('2d');
let mapBase=null, mapTx=null;
(function buildMap(){
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(const p of C){ minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);
                     minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z); }
  const S=mapCan.width, pad=14;
  const sc=Math.min((S-pad*2)/(maxX-minX), (S-pad*2)/(maxZ-minZ));
  const ox=(S-(maxX-minX)*sc)/2 - minX*sc;
  const oz=(S-(maxZ-minZ)*sc)/2 - minZ*sc;
  mapTx = p => [p.x*sc+ox, p.z*sc+oz];

  const bc=document.createElement('canvas'); bc.width=bc.height=S;
  const b=bc.getContext('2d');
  b.lineJoin=b.lineCap='round';
  b.beginPath();
  C.forEach((p,i)=>{ const [x,y]=mapTx(p); i?b.lineTo(x,y):b.moveTo(x,y); });
  b.closePath();
  b.strokeStyle='rgba(255,255,255,.14)'; b.lineWidth=HALF_W*2*sc; b.stroke();
  b.strokeStyle='rgba(160,180,220,.55)'; b.lineWidth=Math.max(1.5,HALF_W*0.34*sc); b.stroke();
  const [fx,fy]=mapTx(C[0]);
  b.fillStyle='#ffd24a'; b.beginPath(); b.arc(fx,fy,4.5,0,6.29); b.fill();
  mapBase=bc;
})();
function drawMap(){
  const S=mapCan.width;
  mctx.clearRect(0,0,S,S);
  mctx.drawImage(mapBase,0,0);
  for(const c of cars){
    if(c.player) continue;
    const [x,y]=mapTx(c.pos);
    mctx.fillStyle='#'+c.color.toString(16).padStart(6,'0');
    mctx.beginPath(); mctx.arc(x,y,6,0,6.29); mctx.fill();
  }
  const [px,py]=mapTx(player.pos);
  mctx.save();
  mctx.translate(px,py); mctx.rotate(-player.yaw+Math.PI);
  mctx.fillStyle='#ff3b30';
  mctx.beginPath(); mctx.moveTo(0,-11); mctx.lineTo(8,8); mctx.lineTo(0,4); mctx.lineTo(-8,8);
  mctx.closePath(); mctx.fill();
  mctx.strokeStyle='#fff'; mctx.lineWidth=1.6; mctx.stroke();
  mctx.restore();
}

/* ============================ 카메라 / 메시 ============================ */
function syncMesh(c){
  c.mesh.position.set(c.pos.x, 0, c.pos.z);
  c.mesh.rotation.set(c.pitch, c.yaw, c.roll);
  for(const w of c.mesh.userData.wheels){
    w.spin.rotation.x = c.wheelSpin;
    w.hub.rotation.y = w.front ? c.steer*0.42 : 0;
  }
}

const camPos=new THREE.Vector3(), camAim=new THREE.Vector3();
let camInit=false;
function updateCamera(dt){
  const sp=player.vel.length();
  const fwd=_f.set(Math.sin(player.yaw),0,Math.cos(player.yaw));

  let dist=11.6+sp*0.085, high=4.6+sp*0.018;
  if(state==='countdown'){
    const a=now*0.0006;
    camPos.set(player.pos.x+Math.sin(a)*13, 5.2, player.pos.z+Math.cos(a)*13);
    camAim.copy(player.pos).setY(1.1);
    camera.position.copy(camPos);
    camera.lookAt(camAim);
    camera.fov=58; camera.updateProjectionMatrix();
    return;
  }

  const want=_t.copy(player.pos).addScaledVector(fwd,-dist); want.y=high;
  if(!camInit){ camPos.copy(want); camInit=true; }
  camPos.lerp(want, 1-Math.pow(0.0009, dt));

  const aim=player.pos.clone().addScaledVector(fwd, 9).setY(1.5);
  camAim.lerp(aim, 1-Math.pow(0.0004, dt));

  camera.position.copy(camPos);
  if(shake>0.001){
    camera.position.x += (Math.random()-0.5)*shake*1.4;
    camera.position.y += (Math.random()-0.5)*shake*1.0;
    camera.position.z += (Math.random()-0.5)*shake*1.4;
  }
  camera.lookAt(camAim);
  const tf = 60 + clamp(sp/62,0,1)*16 + (player.offroad?2:0);
  camera.fov = lerp(camera.fov, tf, 1-Math.pow(0.02,dt));
  camera.updateProjectionMatrix();
}

/* ============================ HUD ============================ */
let hudAcc=0;
function updateHUD(dt){
  hudAcc+=dt;
  const kmh=Math.round(player.vel.length()*3.6);
  $('spd').textContent=kmh;
  $('barFill').style.width=clamp(kmh/235*100,0,100)+'%';

  warnEl.classList.toggle('on', player.wrong && state==='race');

  if(hudAcc<0.08) return;
  hudAcc=0;

  $('lapNow').textContent=Math.min(LAPS, Math.max(1, player.lap));
  $('posNow').textContent=player.rank;
  $('tCur').textContent = state==='race' && !player.finished
    ? fmt(now-player.lapStart) : fmt(player.lastLap);
  $('tBest').textContent=fmt(player.bestLap);

  if(boardEl.classList.contains('on')){
    const sorted=[...cars].sort((a,b)=>a.rank-b.rank);
    boardEl.innerHTML=sorted.map(c=>{
      const gap = c===player ? '' :
        (((c.prog-player.prog)*SEG>=0?'+':'') + ((c.prog-player.prog)*SEG).toFixed(0)+'m');
      const hex='#'+c.color.toString(16).padStart(6,'0');
      return `<div class="row${c.player?' me':''}"><span><span class="dot" style="background:${hex}"></span>`
           + `${c.rank}. ${c.player?'YOU':c.name}</span><b>${gap}</b></div>`;
    }).join('');
  }
}

/* ============================ 루프 ============================ */
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.045, (t-last)/1000);
  last=t; now=t;

  if(state==='race'){
    readPlayerInput();
    for(const c of cars){
      if(c.finished){ c.throttle=0.5; c.brake=0; if(!c.player) driveAI(c,dt); }
      else if(!c.player) driveAI(c,dt);
      stepCar(c,dt);
    }
    collide();
    updateRanks();
  }else{
    for(const c of cars){ c.throttle=0; c.brake=0; c.steer=0; }
  }

  shake=Math.max(0, shake - dt*2.6);
  updatePuffs(dt);
  for(const c of cars) syncMesh(c);
  updateCamera(dt);
  updateHUD(dt);
  drawMap();
  updateEngine();

  sun.position.set(player.pos.x+70, 110, player.pos.z+45);
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();

  renderer.render(scene, camera);
}

gridSetup();
updateCamera(0.016);
requestAnimationFrame(frame);

})();
</script>
